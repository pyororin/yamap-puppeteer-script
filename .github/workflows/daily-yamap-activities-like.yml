name: YAMAPのユーザーの活動記録へのいいね

on:
  workflow_dispatch:
    inputs:
      count:
        description: '処理する投稿件数（動作確認時は小さくする）'
        required: false
        default: '100'
      url:
        description: '特定の活動記録URLのみ処理する（動作確認用。指定時は count を無視）'
        required: false
        default: ''
  schedule:
    # 日本時間の毎日9時、12時、15時、18時、21時に実行
    - cron: '0 0,3,6,9,12 * * *'

# 同じワークフローの多重実行を防ぐ（前回実行が長引いた場合は新規実行をスキップ）
concurrency:
  group: yamap-react-activities
  cancel-in-progress: false

jobs:
  react-activities:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # chromedp の WSURLReadTimeout は既定20秒。ランナー初回の Chrome 起動が
      # これを超えると 'websocket url timeout reached' で失敗するため、事前に一度起動して温めておく。
      - name: Chrome をウォームアップ
        run: |
          google-chrome --version
          time timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom 'data:text/html,warmup' > /dev/null

      - name: 活動一覧ページへの「いいね」を実行
        env:
          YAMAP_EMAIL: ${{ secrets.YAMAP_EMAIL }}
          YAMAP_PASSWORD: ${{ secrets.YAMAP_PASSWORD }}
          ACTIVITIES_POST_COUNT_TO_PROCESS: ${{ inputs.count || '100' }}
          # 入力値は run: に直接展開せず、環境変数経由で渡す（スクリプトインジェクション対策）
          TARGET_URL: ${{ inputs.url }}
        run: |
          if [ -n "$TARGET_URL" ]; then
            go run . -action react-activities -url "$TARGET_URL"
          else
            go run . -action react-activities
          fi

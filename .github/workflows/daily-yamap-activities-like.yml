name: YAMAPのユーザーの活動記録へのいいね

on:
  workflow_dispatch:
  schedule:
    # 日本時間の毎日9時、12時、15時、18時、21時に実行
    - cron: '0 0,3,6,9,12 * * *'

# 同じワークフローの多重実行を防ぐ（前回実行が長引いた場合は新規実行をスキップ）
concurrency:
  group: yamap-react-activities
  cancel-in-progress: false

jobs:
  react-activities:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Chrome の存在を確認
        run: google-chrome --version

      - name: 活動一覧ページへの「いいね」を実行
        env:
          YAMAP_EMAIL: ${{ secrets.YAMAP_EMAIL }}
          YAMAP_PASSWORD: ${{ secrets.YAMAP_PASSWORD }}
          ACTIVITIES_POST_COUNT_TO_PROCESS: '100'
        run: go run main.go -action react-activities

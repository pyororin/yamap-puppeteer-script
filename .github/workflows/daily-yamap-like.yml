name: YAMAPのフォローのタイムラインへのいいね

on:
  workflow_dispatch:
    inputs:
      count:
        description: '処理する投稿件数（動作確認時は小さくする）'
        required: false
        default: '30'
  schedule:
    # 日本時間の毎日12:00 (UTC 03:00) に実行
    - cron: '0 3 * * *'

# 同じワークフローの多重実行を防ぐ（前回実行が長引いた場合は新規実行をスキップ）
concurrency:
  group: yamap-react-timeline
  cancel-in-progress: false

jobs:
  react-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # chromedp の WSURLReadTimeout は既定20秒。ランナー初回の Chrome 起動が
      # これを超えると 'websocket url timeout reached' で失敗するため、事前に一度起動して温めておく。
      - name: Chrome をウォームアップ
        run: |
          google-chrome --version
          time timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom 'data:text/html,warmup' > /dev/null

      - name: タイムラインへの「いいね」を実行
        env:
          YAMAP_EMAIL: ${{ secrets.YAMAP_EMAIL }}
          YAMAP_PASSWORD: ${{ secrets.YAMAP_PASSWORD }}
          TIMELINE_POST_COUNT_TO_PROCESS: ${{ inputs.count || '30' }}
        run: go run . -action react-timeline

name: YAMAPのフォローのタイムラインへのいいね

on:
  workflow_dispatch:
  schedule:
    # 日本時間の毎日12:00 (UTC 03:00) に実行
    - cron: '0 3 * * *'

# 同じワークフローの多重実行を防ぐ（前回実行が長引いた場合は新規実行をスキップ）
concurrency:
  group: yamap-react-timeline
  cancel-in-progress: false

jobs:
  react-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Chrome の存在を確認
        run: google-chrome --version

      - name: タイムラインへの「いいね」を実行
        env:
          YAMAP_EMAIL: ${{ secrets.YAMAP_EMAIL }}
          YAMAP_PASSWORD: ${{ secrets.YAMAP_PASSWORD }}
          TIMELINE_POST_COUNT_TO_PROCESS: '30'
        run: go run main.go -action react-timeline

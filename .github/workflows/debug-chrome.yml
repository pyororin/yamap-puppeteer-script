name: DEBUG Chrome起動診断

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Chrome バイナリと /dev/shm の状態
        run: |
          echo "--- which ---"
          which google-chrome chromium chromium-browser google-chrome-stable headless_shell 2>&1 || true
          echo "--- version ---"
          google-chrome --version
          echo "--- /dev/shm ---"
          df -h /dev/shm
          echo "--- whoami ---"
          whoami; id

      - name: Chrome を単体起動して stderr を見る
        run: |
          set +e
          timeout 60 google-chrome \
            --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage \
            --dump-dom 'data:text/html,<h1>ok</h1>' 2>&1 | tail -40
          echo "exit=$?"

      - name: remote-debugging-port が開くか
        run: |
          set +e
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 \
            'about:blank' > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://127.0.0.1:9222/json/version; then
              echo ""; echo "DEVTOOLS_OK after ${i}s"; break
            fi
            sleep 1
          done
          echo "--- chrome stderr ---"
          tail -40 /tmp/chrome.log

      - name: 最小 chromedp プログラムで再現確認
        run: |
          mkdir -p /tmp/cdp && cd /tmp/cdp
          cat > main.go <<'GO'
          package main

          import (
          	"context"
          	"log"
          	"time"

          	"github.com/chromedp/chromedp"
          )

          func main() {
          	opts := append(chromedp.DefaultExecAllocatorOptions[:],
          		chromedp.Headless,
          		chromedp.NoSandbox,
          		chromedp.DisableGPU,
          	)
          	allocCtx, cancel := chromedp.NewExecAllocator(context.Background(), opts...)
          	defer cancel()
          	ctx, cancel2 := chromedp.NewContext(allocCtx, chromedp.WithDebugf(log.Printf))
          	defer cancel2()
          	ctx, cancel3 := context.WithTimeout(ctx, 60*time.Second)
          	defer cancel3()

          	var title string
          	if err := chromedp.Run(ctx,
          		chromedp.Navigate("https://yamap.com/login"),
          		chromedp.Title(&title),
          	); err != nil {
          		log.Fatalf("FAILED: %v", err)
          	}
          	log.Printf("SUCCESS title=%q", title)
          }
          GO
          go mod init cdptest
          go get github.com/chromedp/chromedp@v0.14.1
          set +e
          go run main.go 2>&1 | tail -60
          echo "exit=$?"

name: DEBUG ログイン診断

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Chrome をウォームアップ
        run: |
          google-chrome --version
          time timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom 'data:text/html,warmup' > /dev/null

      - name: ログイン後の到達状態を診断
        env:
          YAMAP_EMAIL: ${{ secrets.YAMAP_EMAIL }}
          YAMAP_PASSWORD: ${{ secrets.YAMAP_PASSWORD }}
        run: |
          mkdir -p /tmp/dbg && cd /tmp/dbg
          cat > main.go <<'GO'
          package main

          import (
          	"context"
          	"log"
          	"os"
          	"strings"
          	"time"

          	"github.com/chromedp/chromedp"
          )

          func main() {
          	email := os.Getenv("YAMAP_EMAIL")
          	password := os.Getenv("YAMAP_PASSWORD")
          	if email == "" || password == "" {
          		log.Fatal("credentials unset")
          	}

          	opts := append(chromedp.DefaultExecAllocatorOptions[:],
          		chromedp.Headless, chromedp.NoSandbox, chromedp.DisableGPU,
          		chromedp.UserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36"),
          	)
          	ac, c1 := chromedp.NewExecAllocator(context.Background(), opts...)
          	defer c1()
          	ctx, c2 := chromedp.NewContext(ac)
          	defer c2()
          	ctx, c3 := context.WithTimeout(ctx, 8*time.Minute)
          	defer c3()

          	// 本番と同じ手順でフォーム入力＋ログインクリック
          	if err := chromedp.Run(ctx,
          		chromedp.EmulateViewport(1920, 1080),
          		chromedp.Navigate("https://yamap.com/login"),
          		chromedp.WaitVisible(`input[name="email"]`),
          		chromedp.Click(`input[name="email"]`),
          		chromedp.SendKeys(`input[name="email"]`, email),
          		chromedp.Click(`input[name="password"]`),
          		chromedp.SendKeys(`input[name="password"]`, password),
          		chromedp.Evaluate(`document.evaluate("//button[span[text()='ログイン']]", document, null, XPathResult.FIRST_ORDERED_NODE_TYPE, null).singleNodeValue.click()`, nil),
          		chromedp.Sleep(15*time.Second),
          	); err != nil {
          		log.Fatalf("STEP_LOGIN_FAILED: %v", err)
          	}

          	var url, title string
          	if err := chromedp.Run(ctx, chromedp.Location(&url), chromedp.Title(&title)); err != nil {
          		log.Fatalf("STEP_LOCATION_FAILED: %v", err)
          	}
          	log.Printf("AFTER_LOGIN url=%q title=%q", url, title)

          	// ログイン状態の判定材料
          	var loginFormStillThere bool
          	_ = chromedp.Run(ctx, chromedp.Evaluate(`!!document.querySelector('input[name="password"]')`, &loginFormStillThere))
          	log.Printf("LOGIN_FORM_STILL_PRESENT=%v", loginFormStillThere)

          	// ページ内のエラー/警告らしきテキスト
          	var errText string
          	_ = chromedp.Run(ctx, chromedp.Evaluate(`
          		Array.from(document.querySelectorAll('[class*="rror"],[class*="lert"],[role="alert"]'))
          		     .map(e=>e.textContent.trim()).filter(Boolean).slice(0,5).join(" | ")`, &errText))
          	log.Printf("PAGE_ERROR_TEXT=%q", errText)

          	// /timeline へ移動して本番が待っているセレクタの有無を見る
          	if err := chromedp.Run(ctx,
          		chromedp.Navigate("https://yamap.com/timeline"),
          		chromedp.Sleep(15*time.Second),
          		chromedp.Location(&url),
          		chromedp.Title(&title),
          	); err != nil {
          		log.Fatalf("STEP_TIMELINE_FAILED: %v", err)
          	}
          	log.Printf("TIMELINE url=%q title=%q", url, title)

          	var hasFeed bool
          	_ = chromedp.Run(ctx, chromedp.Evaluate(`!!document.querySelector('.TimelineList__Feed')`, &hasFeed))
          	log.Printf("HAS_TimelineList__Feed=%v", hasFeed)

          	// タイムラインらしき候補クラス名を列挙（セレクタ変更の手がかり）
          	var classes string
          	_ = chromedp.Run(ctx, chromedp.Evaluate(`
          		Array.from(new Set(Array.from(document.querySelectorAll('[class]'))
          		     .flatMap(e=>Array.from(e.classList))
          		     .filter(c=>/Timeline|Feed|Activity|Article/i.test(c)))).slice(0,40).join(", ")`, &classes))
          	log.Printf("CANDIDATE_CLASSES=%s", classes)

          	var bodyLen int
          	_ = chromedp.Run(ctx, chromedp.Evaluate(`document.body.innerText.length`, &bodyLen))
          	log.Printf("BODY_TEXT_LEN=%d", bodyLen)

          	var head string
          	_ = chromedp.Run(ctx, chromedp.Evaluate(`document.body.innerText.slice(0,400)`, &head))
          	log.Printf("BODY_HEAD=%s", strings.ReplaceAll(head, "\n", " / "))
          }
          GO
          go mod init dbg
          go get github.com/chromedp/chromedp@v0.14.1
          set +e
          go run main.go 2>&1 | grep -vE '"method"|<- \{|-> \{'
          echo "exit=$?"
